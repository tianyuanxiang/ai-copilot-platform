app:
  name: ai-copilot-engine
  env: dev              # dev | staging | prod

llm:
  mock: false
  provider: deepseek    # mock | deepseek
  model: deepseek-v4-pro
  deepseek_chat_url: "https://api.deepseek.com/chat/completions"
  api_key: ""           # Fill in production.
  timeout_seconds: 60

postgres:
  dsn: "postgresql://user:password@host:5432/dbname"

elasticsearch:
  url: "http://host:9200"
  kb_chunks_index: kb_chunks_index
  security_logs_index: security_logs_index

embedding:
  provider: mock            # mock | dashscope
  model: text-embedding-v4
  api_key: ""               # optional; falls back to DASHSCOPE_API_KEY
  dimension: 1024           # keep aligned with pgvector vector(1024)
  batch_size: 10            # Bailian OpenAI-compatible embedding requests are batched here
  timeout_seconds: 30

rerank:
  provider: mock            # mock | dashscope
  model: qwen3-rerank
  api_key: ""               # optional; falls back to DASHSCOPE_API_KEY
  top_n: 5
  timeout_seconds: 30
