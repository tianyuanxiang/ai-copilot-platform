[project]
name = "ai-copilot-engine"
version = "0.1.0"
description = "FastAPI ASGI AI engine skeleton for developer AI copilot platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "elasticsearch[async]>=8.14.0",
    "pyyaml>=6.0",
    "langchain-text-splitters>=0.3.0",
    "python-docx>=1.1.2",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=3.0.0",
    "grpcio>=1.80.0",
    "protobuf>=6.31.1",
    "psycopg[binary,pool]>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.80.0",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
