apiVersion: apps/v1
kind: Deployment
metadata:
  name: blade-rpc
  namespace: blade
  labels:
    app: blade-rpc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blade-rpc
  template:
    metadata:
      labels:
        app: blade-rpc
    spec:
      initContainers:
        - name: wait-for-etcd
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z etcd-0.etcd-headless.blade.svc.cluster.local 2379; do
                echo "等待 etcd 就绪..."
                sleep 2
              done
        - name: wait-for-pgsql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgresql.blade.svc.cluster.local 5432; do
                echo "等待 PostgreSQL 就绪..."
                sleep 2
              done
      containers:
        - name: blade-rpc
          image: blade-rpc:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 9300
          volumeMounts:
            - name: config
              mountPath: /app/etc
            - name: uploads
              mountPath: /app/uploads
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 9300
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9300
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: blade-rpc-config
        - name: uploads
          persistentVolumeClaim:
            claimName: blade-uploads

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blade-uploads
  namespace: blade
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
