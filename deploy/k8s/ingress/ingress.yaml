apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blade-ingress
  namespace: blade
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - host: blade.local
      http:
        paths:
          
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 6666
          
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 6666
         
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 6666
         
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
